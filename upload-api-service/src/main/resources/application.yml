spring:
  application:
    name: upload-api-service

  datasource:
    url: jdbc:postgresql://localhost:5433/facturas   # 5433: ver nota en docker-compose.yml
    username: facturas
    password: facturas

  jpa:
    hibernate:
      # Flyway es el dueño del esquema. Hibernate solo verifica que las
      # entidades coincidan con lo que las migraciones crearon.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: facturas
    password: facturas

    # El relay espera la confirmación del broker antes de marcar el
    # evento como publicado. Sin esto, `send` que vuelve sin excepción
    # solo significa que los bytes llegaron al socket: un broker que
    # muere antes de escribir el mensaje se lo lleva, y el relay ya
    # marcó la fila como publicada. El evento se pierde sin rastro, que
    # es justo la falla que el outbox existe para descartar.
    #
    # `simple` y no `correlated`: correlated entrega las confirmaciones
    # por callback asincrónico, y el relay necesita saber el resultado
    # antes de commitear su transacción. Con simple se puede esperar
    # dentro de un `invoke`, que es sincrónico.
    publisher-confirm-type: simple

    listener:
      simple:
        # El ack lo manda el consumidor, después de que la extracción
        # commiteó. Con `auto` (el default) Spring confirma el mensaje al
        # volver del método: una caída a mitad de la extracción perdería
        # el mensaje y dejaría el job en PROCESSING sin nada que lo
        # reprocese.
        acknowledge-mode: manual
        # Un mensaje por vez. La extracción es trabajo de CPU y de I/O
        # con el almacenamiento, no una llamada corta: traer veinte
        # mensajes por adelantado solo los deja esperando en memoria de
        # este consumidor en vez de en la cola, donde otro los podría
        # tomar. El número sube cuando haya más de un worker y se haya
        # medido.
        prefetch: 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

# Configuración propia del proyecto
facturas:
  outbox:
    # Cada cuánto barre el relay buscando eventos sin publicar.
    #
    # NO es el camino normal: la subida despierta al relay en cuanto
    # commitea, así que en condiciones normales el evento sale en
    # milisegundos y este barrido no encuentra nada. Está para lo que
    # falla — el proceso que murió justo después del commit, o el
    # transporte que estuvo caído un rato.
    #
    # Formato ISO-8601 obligatorio: fixedDelayString acepta "PT5S" o un
    # número de milisegundos, pero NO "5s" (Spring solo parsea como
    # Duration lo que empieza con P).
    sweep-interval: PT5S

  storage:
    # S3Mock en dev. En producción, el endpoint de S3 real o el que
    # corresponda: el código va por el SDK de S3 y no sabe la diferencia.
    endpoint: http://localhost:9090
    bucket: facturas
    access-key: test
    secret-key: test
    region: us-east-1
    # LocalStack y MinIO necesitan path-style; S3 real usa virtual-hosted.
    path-style-access: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    ar.facturas: DEBUG
