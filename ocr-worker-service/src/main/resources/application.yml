spring:
  application:
    name: ocr-worker-service

  datasource:
    url: jdbc:postgresql://localhost:5433/facturas   # 5433: ver nota en docker-compose.yml
    username: facturas
    password: facturas

  jpa:
    hibernate:
      # `validate` y no `update`: el dueño del esquema es la API, que lo
      # migra con Flyway. Acá solo se verifica que lo que las entidades
      # esperan esté realmente ahí, y si no está el worker se niega a
      # arrancar — que es lo correcto. Dos servicios compitiendo por
      # migrar la misma base al arrancar es, en el mejor caso, contención
      # de locks.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379
      # Corto a proposito: el timeout es la red que atrapa una
      # invalidacion que fallo. Ver JobCache.
      timeout: 2s

  # Flyway ni está en el classpath de este módulo. Esta línea existe para
  # que el día que entre por una dependencia transitiva no arranque sola.
  flyway:
    enabled: false

  rabbitmq:
    host: localhost
    port: 5672
    username: facturas
    password: facturas

    listener:
      simple:
        # El ack lo manda el consumidor, después de que la extracción
        # commiteó. Con `auto` Spring confirma el mensaje al volver del
        # método: una caída a mitad de la extracción perdería el mensaje
        # y dejaría el job en PROCESSING sin nada que lo reprocese.
        acknowledge-mode: manual
        # Un mensaje por vez. La extracción es trabajo de CPU y de I/O
        # con el almacenamiento, no una llamada corta: traer veinte
        # mensajes por adelantado solo los deja esperando en memoria de
        # este consumidor en vez de en la cola, donde otra réplica los
        # podría tomar. El número sube cuando haya más de una y se haya
        # medido.
        prefetch: 1

server:
  # 8081: el 8080 es de la API. Este puerto no atiende a nadie más que a
  # Actuator — el worker no tiene endpoints propios.
  port: 8081

facturas:
  cache:
    # TTL del cache de GET /jobs/{id}.
    #
    # Segundos y no minutos, y el motivo es el modo de falla: la
    # invalidacion la manda el worker, y si el worker no puede hablar con
    # Redis la entrada vieja se queda hasta que expire. El TTL es la
    # garantia de ultimo recurso, igual que el barrido detras del camino
    # rapido del relay y el reaper detras de la cola — solo que aca la
    # garantia es "dentro del TTL", asi que el TTL tiene que ser chico.
    #
    # 30s tambien es mas que suficiente para lo que esto resuelve: el
    # frontend pregunta por el mismo job cada uno o dos segundos mientras
    # se procesa, y casi toda respuesta es igual a la anterior.
    job-ttl: PT30S

  storage:
    endpoint: http://localhost:9090
    bucket: facturas
    access-key: test
    secret-key: test
    region: us-east-1
    path-style-access: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    ar.facturas: DEBUG
