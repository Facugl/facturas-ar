server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for what the browser will ask for. The JS bundle is ~410 kB
    # and ~135 kB compressed, which is the difference between a phone on
    # mobile data waiting and not.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── The API, under the same origin ───────────────────────────────
    #
    # This is the whole reason there is an nginx here rather than a bucket
    # with static files. The session cookie is HttpOnly and SameSite=Lax
    # (ADR 015), and a browser will not send a Lax cookie across origins —
    # the only way around that is SameSite=None; Secure, which needs HTTPS
    # and so does not work on http://localhost at all.
    #
    # The alternatives were to weaken the cookie or to drop cookies for a
    # token and undo ADR 015 to suit the deployment. Proxying costs these
    # few lines and means the browser sees one origin, the same way the
    # Vite dev server is configured — so what is developed against is what
    # ships.
    #
    # The paths are listed rather than mounting the API under /api,
    # because the API's paths are already documented, exercised by curl in
    # the README and asserted by the tests.
    location ~ ^/(auth|documents|jobs|export|actuator)(/|$) {
        proxy_pass http://upload-api-service:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An upload is 10 MB at most, and nginx's default of 1 MB would
        # refuse a photo with a 413 the API never sees.
        client_max_body_size 12m;

        # The extraction is asynchronous, so no request here is slow —
        # but the CSV export of a year is built in one, so the read
        # timeout is not the 60 s default pared down.
        proxy_read_timeout 120s;
    }

    # ── The SPA ──────────────────────────────────────────────────────

    # Hashed filenames, so they can be cached forever: a changed file has
    # a different name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the app. try_files is what makes a reload on any
    # path work — there is one HTML file and the app decides what to show.
    location / {
        try_files $uri $uri/ /index.html;

        # And index.html itself is never cached, or a deploy would leave
        # browsers pointing at asset names that no longer exist.
        add_header Cache-Control "no-cache";
    }
}
