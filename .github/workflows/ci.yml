name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push encima de otro cancela el build anterior: lo que importa es que
# la última versión esté sana, no gastar minutos en una intermedia.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y testear
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Cachea ~/.m2 entre corridas. Sin esto cada build se baja
          # Spring Boot entero otra vez.
          cache: maven

      # El wrapper pierde el bit de ejecutable al pasar por Windows.
      - name: Permisos del wrapper
        run: chmod +x ./mvnw

      # Tesseract, porque los tests del OCR corren de verdad.
      #
      # El jar de Tess4J trae `eng.traineddata` y los nativos de WINDOWS,
      # asi que en una laptop Windows el OCR funciona sin instalar nada —
      # y en este runner, que es Linux, no: falla con
      # `NoClassDefFoundError: Could not initialize class TessAPI`.
      #
      # Es la misma forma de bug que ReviewPostgresTest con el S3Mock:
      # verde local porque la maquina tiene algo que CI no. Y el arreglo
      # es el mismo — que CI tenga las dependencias nativas del runtime,
      # no que el test se saltee. `TesseractOcrEngineTest` esta escrito
      # para GRITAR cuando Tesseract no esta, porque sin el todo
      # comprobante sin QR degrada en silencio a nada extraido, que se ve
      # igual que "esa foto no se podia leer". Aca grito, e hizo su
      # trabajo.
      #
      # `-spa` y no solo el base: es el mismo paquete que instala la
      # imagen del worker, asi que CI mide con el modelo de espanol que
      # corre en produccion y no con el ingles del jar.
      - name: Instalar Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          tesseract --version | head -2
          # La ruta la descubre, no la adivina: lleva el numero mayor de
          # Tesseract (hoy /usr/share/tesseract-ocr/5/tessdata) y
          # ubuntu-latest va a cambiar de version algun dia. Hardcodearla
          # no romperia los tests —el motor cae al `eng` del jar— pero CI
          # mediria con otro idioma que produccion y en silencio.
          echo "TESSDATA_PREFIX=$(dirname "$(find /usr/share/tesseract-ocr -name spa.traineddata | head -1)")" >> "$GITHUB_ENV"
          echo "tessdata en: $TESSDATA_PREFIX"

      - name: Verificar que spa quedo disponible
        # Un paso propio porque es la diferencia entre medir con el modelo
        # de espanol y medir con el de ingles, y las dos cosas pasan los
        # tests.
        run: |
          test -f "$TESSDATA_PREFIX/spa.traineddata"             || { echo "no hay spa.traineddata en $TESSDATA_PREFIX"; exit 1; }
          echo "ok: $TESSDATA_PREFIX/spa.traineddata"

      # TESSDATA_PREFIX lo puso el paso de arriba en GITHUB_ENV, que es
      # la misma variable que exporta la imagen del worker.
      - name: Compilar y correr los tests
        run: ./mvnw -B --no-transfer-progress verify

      # Si algo falla, el log de Maven dice qué test rompió pero no por
      # qué. Los reportes de Surefire sí, y sin esto se pierden con el
      # runner.
      - name: Guardar los reportes de test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: '**/target/surefire-reports/**'
          retention-days: 7

  frontend:
    name: Compilar y testear el frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Cachea ~/.npm usando el lockfile como clave.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci` y no `install`: instala exactamente lo que dice el lockfile,
      # así CI prueba las versiones que se probaron y no las que el
      # registry ofrezca hoy.
      - name: Instalar
        working-directory: frontend
        run: npm ci

      - name: Tests
        working-directory: frontend
        run: npm test

      # `tsc -b && vite build`: el type check es parte del build a
      # propósito. Es lo único que cubre los componentes que no tienen
      # test, y es lo que se rompe cuando la API cambia un campo y el
      # frontend sigue leyéndolo.
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Construir la imagen
    runs-on: ubuntu-latest
    # Solo después de que los tests pasen: una imagen de código roto no
    # le sirve a nadie.
    needs: [build, frontend]

    steps:
      - uses: actions/checkout@v4

      # Sin esto el runner usa el driver "docker", que no sabe exportar
      # cache: `cache-to: type=gha` falla con "Cache export is not
      # supported for the docker driver". buildx levanta el driver
      # docker-container, que sí.
      - name: Configurar buildx
        uses: docker/setup-buildx-action@v3

      # No se publica en ningún lado todavía. Lo que verifica es que el
      # Dockerfile siga construyendo, que es justo lo que se rompe en
      # silencio cuando alguien agrega un módulo y olvida copiarlo.
      - name: Construir upload-api-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: upload-api-service/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Las dos imagenes, porque las dos listan los modulos del pom padre
      # y las dos se rompen igual cuando falta uno. Y con `scope`
      # distinto: comparten la clave del cache de gha, asi que sin eso una
      # le pisa el cache a la otra en cada corrida.
      - name: Construir ocr-worker-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ocr-worker-service/Dockerfile
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # La tercera, y el contexto es ./frontend y no la raíz: esta imagen
      # no necesita el pom padre ni los módulos hermanos, solo el
      # package-lock y el src.
      - name: Construir el frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
