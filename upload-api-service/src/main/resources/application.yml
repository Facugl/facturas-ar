spring:
  application:
    name: upload-api-service

  datasource:
    url: jdbc:postgresql://localhost:5433/facturas   # 5433: ver nota en docker-compose.yml
    username: facturas
    password: facturas

  jpa:
    hibernate:
      # Flyway es el dueño del esquema. Hibernate solo verifica que las
      # entidades coincidan con lo que las migraciones crearon.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

# Configuración propia del proyecto
facturas:
  storage:
    # S3Mock en dev. En producción, el endpoint de S3 real o el que
    # corresponda: el código va por el SDK de S3 y no sabe la diferencia.
    endpoint: http://localhost:9090
    bucket: facturas
    access-key: test
    secret-key: test
    region: us-east-1
    # LocalStack y MinIO necesitan path-style; S3 real usa virtual-hosted.
    path-style-access: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    ar.facturas: DEBUG
