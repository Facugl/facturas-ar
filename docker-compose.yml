# Infraestructura local.
#
# Todo lo que el codigo usa hoy corre aca. Mantener acá solo lo que el
# código usa hoy: si levantás servicios que nadie consume, dejás de
# saber qué necesita realmente el sistema.

services:
  postgres:
    image: postgres:16-alpine
    container_name: facturas-postgres
    environment:
      POSTGRES_DB: facturas
      POSTGRES_USER: facturas
      POSTGRES_PASSWORD: facturas
    ports:
      # 5433 en el host a propósito: el 5432 suele estar ocupado por una
      # instalación nativa de PostgreSQL. Si los dos escuchan, el nativo
      # gana y la app se conecta a la base equivocada, con un error de
      # autenticación que no dice nada de todo esto.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturas -d facturas"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Almacenamiento de objetos S3-compatible.
  #
  # Es la tercera opción: las dos anteriores cayeron por licenciamiento.
  #   - MinIO: sus imágenes dejaron de ser públicas (Docker Hub y quay.io
  #     piden login).
  #   - LocalStack: la imagen `stable` exige LOCALSTACK_AUTH_TOKEN y sale
  #     con exit 55 sin él.
  # S3Mock es Apache 2.0 y arranca sin credenciales ni registro.
  #
  # El código va por el SDK de S3 igual, así que el día que esto apunte a
  # S3 real o a cualquier otro backend solo cambia el endpoint. Esa es
  # toda la razón por la que el almacenamiento está detrás de un puerto.
  s3:
    image: adobe/s3mock:latest
    container_name: facturas-s3
    ports:
      - "9090:9090"
    # Sin `initialBuckets`: esta versión de S3Mock ignora esa variable de
    # entorno (llega al contenedor pero no la bindea). No vale la pena
    # pelearla, porque la solución correcta es otra: **la aplicación se
    # asegura de que el bucket exista al arrancar** (headBucket y, si da
    # 404, createBucket). Eso hay que hacerlo igual contra S3 real,
    # funciona con cualquier backend, y saca una dependencia de cómo se
    # configura un contenedor puntual.
    #
    # Nota: los archivos quedan en un temp dir adentro del contenedor y se
    # pierden al recrearlo. Para desarrollo alcanza.

  # El transporte de los eventos del outbox.
  #
  # La imagen `management` en vez de la pelada: trae la consola web en el
  # 15672, y para un proyecto cuyo argumento es mensajería asíncrona,
  # poder abrir la cola y ver el mensaje adentro no es un lujo — es la
  # mitad de cómo se depura esto. Cuesta unos MB de imagen.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: facturas-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: facturas
      RABBITMQ_DEFAULT_PASS: facturas
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # consola: http://localhost:15672 (facturas/facturas)
    healthcheck:
      # `check_running` y no un simple ping al puerto: el 5672 acepta
      # conexiones antes de que el nodo esté listo para declarar colas, y
      # ahí la aplicación arranca, falla al declarar la topología y
      # reintenta en silencio.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  upload-api-service:
    build:
      # Contexto en la raíz: es un proyecto multi-módulo y el build
      # necesita el pom padre y los módulos hermanos.
      context: .
      dockerfile: upload-api-service/Dockerfile
    container_name: facturas-api
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Adentro de la red de compose los servicios se alcanzan por su
      # nombre y por su puerto INTERNO. Acá va postgres:5432, no
      # localhost:5433: el 5433 es el mapeo al host, y desde adentro no
      # existe. Es el error que convierte un "no conecta" en media tarde.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/facturas
      SPRING_DATASOURCE_USERNAME: facturas
      SPRING_DATASOURCE_PASSWORD: facturas
      FACTURAS_STORAGE_ENDPOINT: http://s3:9090
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: facturas
      SPRING_RABBITMQ_PASSWORD: facturas
      SPRING_DATA_REDIS_HOST: redis
      # Logs en JSON (Elastic Common Schema), y SOLO adentro del
      # contenedor: corriendo el jar a mano queremos leerlos nosotros.
      # Spring Boot 4 lo trae nativo — no hace falta
      # logstash-logback-encoder, que es lo que el README especificaba.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "8080:8080"

  # Cache-aside de GET /jobs/{id}, que es el read que el frontend
  # machaca: el mismo job cada uno o dos segundos mientras se procesa.
  #
  # Lo interesante no es el cache, es la invalidacion: la API lee y el
  # WORKER invalida, porque el worker es el que termina el job. En un
  # solo proceso seria un Map.remove.
  redis:
    image: redis:7-alpine
    container_name: facturas-redis
    # Sin persistencia a proposito: un cache que sobrevive al reinicio es
    # un cache que puede devolver algo de antes de un deploy. Que arranque
    # vacio es lo correcto.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # La cascada de extraccion, del otro lado de la cola.
  #
  # Es un deployable aparte por perfil de recursos, no por dominio
  # (ADR 006): esta imagen carga los binarios nativos de OpenCV y quema
  # CPU por documento, y la API no tiene por que cargar nada de eso.
  #
  # No expone puerto al host: no atiende a nadie. El 8081 es Actuator, y
  # Prometheus lo alcanza por la red interna.
  ocr-worker-service:
    build:
      context: .
      dockerfile: ocr-worker-service/Dockerfile
    container_name: facturas-worker
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      # Espera a la API porque el esquema lo migra ella (ADR 013): este
      # servicio corre con ddl-auto: validate y no tiene Flyway, asi que
      # arrancar primero significa fallar validando una base vacia.
      #
      # La topologia del broker NO esta en esta lista: los dos servicios
      # la declaran, justamente para no depender del orden.
      upload-api-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/facturas
      SPRING_DATASOURCE_USERNAME: facturas
      SPRING_DATASOURCE_PASSWORD: facturas
      FACTURAS_STORAGE_ENDPOINT: http://s3:9090
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: facturas
      SPRING_RABBITMQ_PASSWORD: facturas
      SPRING_DATA_REDIS_HOST: redis
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

  # Scrapea /actuator/prometheus de los dos servicios.
  #
  # Entra ahora y no con los dashboards porque hay un numero que depende
  # de esto: el timeout del reaper son 10 minutos "generoso a proposito"
  # porque nada midio cuanto tarda una extraccion. Ver la nota en
  # application.yml.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: facturas-prometheus
    depends_on:
      upload-api-service:
        condition: service_started
      ocr-worker-service:
        condition: service_started
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 15 dias alcanzan para elegir un timeout y ver una tendencia; la
      # retencion larga es un problema de produccion, no de desarrollo.
      - --storage.tsdb.retention.time=15d
    ports:
      - "9091:9090"   # 9091 en el host: el 9090 lo usa S3Mock

  # Los dashboards, provisionados desde el repositorio.
  #
  # Ni el datasource ni los paneles se configuran por la consola: lo que
  # se configura clickeando se pierde al recrear el contenedor y no queda
  # versionado. Es el mismo motivo por el que la topologia de RabbitMQ la
  # declara la aplicacion y no un script.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: facturas-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: facturas
      GF_SECURITY_ADMIN_PASSWORD: facturas
      # Sin login para mirar: esto corre en una maquina de desarrollo y
      # el tablero no tiene nada privado. Un paso menos entre levantar el
      # stack y ver si el pipeline esta sano.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Abre directo en el dashboard del pipeline en vez de en la pagina
      # de bienvenida.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pipeline.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
