# Infraestructura local — Fase 1 (síncrona).
#
# RabbitMQ, Redis, Prometheus y Grafana entran en las Fases 2 y 3.
# Mantener acá solo lo que el código usa hoy: si levantás servicios
# que nadie consume, dejás de saber qué necesita realmente el sistema.

services:
  postgres:
    image: postgres:16-alpine
    container_name: facturas-postgres
    environment:
      POSTGRES_DB: facturas
      POSTGRES_USER: facturas
      POSTGRES_PASSWORD: facturas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturas -d facturas"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # TODO: pinear a un RELEASE concreto una vez que el stack funcione.
    # `latest` es cómodo ahora y deja de serlo el día que cambie algo.
    image: minio/minio:latest
    container_name: facturas-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO arranca sin buckets. Sin esto, la primera subida falla con
  # NoSuchBucket y perdés media hora averiguando por qué.
  minio-init:
    image: minio/mc:latest
    container_name: facturas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/facturas &&
      mc anonymous set none local/facturas &&
      echo 'bucket facturas listo'
      "

volumes:
  postgres-data:
  minio-data:
