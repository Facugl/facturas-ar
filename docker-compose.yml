# Infraestructura local — Fase 1 (síncrona).
#
# RabbitMQ, Redis, Prometheus y Grafana entran en las Fases 2 y 3.
# Mantener acá solo lo que el código usa hoy: si levantás servicios
# que nadie consume, dejás de saber qué necesita realmente el sistema.

services:
  postgres:
    image: postgres:16-alpine
    container_name: facturas-postgres
    environment:
      POSTGRES_DB: facturas
      POSTGRES_USER: facturas
      POSTGRES_PASSWORD: facturas
    ports:
      # 5433 en el host a propósito: el 5432 suele estar ocupado por una
      # instalación nativa de PostgreSQL. Si los dos escuchan, el nativo
      # gana y la app se conecta a la base equivocada, con un error de
      # autenticación que no dice nada de todo esto.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturas -d facturas"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Almacenamiento de objetos S3-compatible.
  #
  # Es la tercera opción: las dos anteriores cayeron por licenciamiento.
  #   - MinIO: sus imágenes dejaron de ser públicas (Docker Hub y quay.io
  #     piden login).
  #   - LocalStack: la imagen `stable` exige LOCALSTACK_AUTH_TOKEN y sale
  #     con exit 55 sin él.
  # S3Mock es Apache 2.0 y arranca sin credenciales ni registro.
  #
  # El código va por el SDK de S3 igual, así que el día que esto apunte a
  # S3 real o a cualquier otro backend solo cambia el endpoint. Esa es
  # toda la razón por la que el almacenamiento está detrás de un puerto.
  s3:
    image: adobe/s3mock:latest
    container_name: facturas-s3
    ports:
      - "9090:9090"
    # Sin `initialBuckets`: esta versión de S3Mock ignora esa variable de
    # entorno (llega al contenedor pero no la bindea). No vale la pena
    # pelearla, porque la solución correcta es otra: **la aplicación se
    # asegura de que el bucket exista al arrancar** (headBucket y, si da
    # 404, createBucket). Eso hay que hacerlo igual contra S3 real,
    # funciona con cualquier backend, y saca una dependencia de cómo se
    # configura un contenedor puntual.
    #
    # Nota: los archivos quedan en un temp dir adentro del contenedor y se
    # pierden al recrearlo. Para desarrollo alcanza.

  upload-api-service:
    build:
      # Contexto en la raíz: es un proyecto multi-módulo y el build
      # necesita el pom padre y los módulos hermanos.
      context: .
      dockerfile: upload-api-service/Dockerfile
    container_name: facturas-api
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      # Adentro de la red de compose los servicios se alcanzan por su
      # nombre y por su puerto INTERNO. Acá va postgres:5432, no
      # localhost:5433: el 5433 es el mapeo al host, y desde adentro no
      # existe. Es el error que convierte un "no conecta" en media tarde.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/facturas
      SPRING_DATASOURCE_USERNAME: facturas
      SPRING_DATASOURCE_PASSWORD: facturas
      FACTURAS_STORAGE_ENDPOINT: http://s3:9090
    ports:
      - "8080:8080"

volumes:
  postgres-data:
