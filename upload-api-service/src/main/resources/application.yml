spring:
  application:
    name: upload-api-service

  datasource:
    url: jdbc:postgresql://localhost:5433/facturas   # 5433: ver nota en docker-compose.yml
    username: facturas
    password: facturas

  jpa:
    hibernate:
      # Flyway es el dueño del esquema. Hibernate solo verifica que las
      # entidades coincidan con lo que las migraciones crearon.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: facturas
    password: facturas

    # El relay espera la confirmación del broker antes de marcar el
    # evento como publicado. Sin esto, `send` que vuelve sin excepción
    # solo significa que los bytes llegaron al socket: un broker que
    # muere antes de escribir el mensaje se lo lleva, y el relay ya
    # marcó la fila como publicada. El evento se pierde sin rastro, que
    # es justo la falla que el outbox existe para descartar.
    #
    # `simple` y no `correlated`: correlated entrega las confirmaciones
    # por callback asincrónico, y el relay necesita saber el resultado
    # antes de commitear su transacción. Con simple se puede esperar
    # dentro de un `invoke`, que es sincrónico.
    publisher-confirm-type: simple

    listener:
      simple:
        # El ack lo manda el consumidor, después de que la extracción
        # commiteó. Con `auto` (el default) Spring confirma el mensaje al
        # volver del método: una caída a mitad de la extracción perdería
        # el mensaje y dejaría el job en PROCESSING sin nada que lo
        # reprocese.
        acknowledge-mode: manual
        # Un mensaje por vez. La extracción es trabajo de CPU y de I/O
        # con el almacenamiento, no una llamada corta: traer veinte
        # mensajes por adelantado solo los deja esperando en memoria de
        # este consumidor en vez de en la cola, donde otro los podría
        # tomar. El número sube cuando haya más de un worker y se haya
        # medido.
        prefetch: 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

# Configuración propia del proyecto
facturas:
  outbox:
    # Cada cuánto barre el relay buscando eventos sin publicar.
    #
    # NO es el camino normal: la subida despierta al relay en cuanto
    # commitea, así que en condiciones normales el evento sale en
    # milisegundos y este barrido no encuentra nada. Está para lo que
    # falla — el proceso que murió justo después del commit, o el
    # transporte que estuvo caído un rato.
    #
    # Formato ISO-8601 obligatorio: fixedDelayString acepta "PT5S" o un
    # número de milisegundos, pero NO "5s" (Spring solo parsea como
    # Duration lo que empieza con P).
    sweep-interval: PT5S

  recovery:
    # El reaper: los jobs que ninguna cola va a mover.
    #
    # Lee la BASE, no una cola, y eso es lo que lo hace la garantia. Una
    # cola solo puede contarte de un mensaje que todavia tiene; la tabla
    # `jobs` sabe de todo job que necesita trabajo sin importar que paso
    # con ningun mensaje. Es la misma razon por la que el relay del
    # outbox tiene un barrido periodico detras de su camino rapido.
    interval: PT1M

    # Cuanto puede estar un job en PROCESSING antes de darlo por colgado.
    #
    # Eran 10 minutos "generoso a proposito porque nada lo midio". Ahora
    # esta medido, con 25 comprobantes sinteticos con QR real por el
    # stack completo (invoice.job.processing.time, outcome="extracted"):
    #
    #   en el host, con el jar:     p50 112 ms   p95 224 ms   max 1466 ms
    #   en el contenedor:           p50 103 ms   p95 336 ms
    #
    # La segunda es la que cuenta: menos CPU disponible, mas parecido a
    # como corre esto de verdad.
    #
    # 2 minutos son ~360x ese p95 y ~82x el maximo medido. El margen es
    # enorme a proposito, por dos cosas que la medicion NO cubre:
    #
    #   1. El OCR todavia no existe. Tesseract sobre un escaneo de varias
    #      paginas es el caso lento de verdad, y hoy no se puede medir
    #      porque Tess4J entra en la semana 5. Una estimacion pesimista
    #      —10 paginas a 3 s— son 30 s, y 2 minutos siguen siendo 4x eso.
    #   2. El riesgo no es simetrico. Si el cutoff queda corto el reaper
    #      le roba el job a un worker que todavia esta trabajando, y ahi
    #      deja de ser un mecanismo de recuperacion y se vuelve un
    #      duplicador. Si queda largo, un job colgado tarda mas en
    #      volver, y eso no le cuesta nada a nadie todavia.
    #
    # Lo que hace seguro acortarlo es que ahora el error se VE: un cutoff
    # corto aparece como un pico en invoice_job_duplicate_delivery_total
    # y en jobs que terminan FAILED sin motivo. Antes de las metricas,
    # equivocarse era invisible — por eso 10 minutos.
    #
    # Hay que volver a medirlo cuando entre el OCR. La metrica ya esta.
    processing-timeout: PT2M

    # Cuanto espera antes de reintentar un job en FAILED.
    #
    # Sin esto el reaper se quemaria los tres intentos en tres de sus
    # propias corridas, y eso no ayuda a nadie: un PDF corrupto falla
    # igual las tres veces, y una caida transitoria necesita mas de tres
    # minutos para pasar. Es un backoff crudo — uno de verdad necesita el
    # plugin de delayed message de RabbitMQ, que esta fuera de alcance
    # para la v1.
    failed-retry-delay: PT5M

  storage:
    # S3Mock en dev. En producción, el endpoint de S3 real o el que
    # corresponda: el código va por el SDK de S3 y no sabe la diferencia.
    endpoint: http://localhost:9090
    bucket: facturas
    access-key: test
    secret-key: test
    region: us-east-1
    # LocalStack y MinIO necesitan path-style; S3 real usa virtual-hosted.
    path-style-access: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    ar.facturas: DEBUG
